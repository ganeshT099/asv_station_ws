asv_path_generator:
  ros__parameters:
    use_sim_time: true
    path_type: circle
    path_width: 1.60
    path_height: 1.20
    path_center_x: 0.0
    path_center_y: 0.0
    corner_roundness: 4.0
    sample_count: 500
    speed: 0.10
    publish_rate: 25.0
    reference_frame: world
    auto_start: true
    repeat_path: true
    lap_count: 0
    start_phase: 0.0
    path_z: 0.08

asv_path_tracking_controller:
  ros__parameters:
    use_sim_time: true
    control_rate: 25.0
    max_thrust: 3.0
    kp_x: 2.2
    ki_x: 0.05
    kd_x: 1.6
    kp_y: 2.2
    ki_y: 0.05
    kd_y: 1.6
    kp_yaw: 1.4
    ki_yaw: 0.03
    kd_yaw: 0.45
    integral_limit: 0.40
    integral_leak: 0.05
    slew_rate: 1.50
    velocity_filter_tau: 0.15
    reference_timeout: 1.0
    lookahead_distance: 0.25
    odom_timeout: 1.0
    enable_current_compensation: true
    enable_yaw_control: true
    enable_tilt_guard: true
    tilt_soft_limit: 0.10
    tilt_hard_limit: 0.35
    status_rate: 2.0
    log_file: /tmp/asv_path_tracking.csv

asv_path_tracking_visualization:
  ros__parameters:
    use_sim_time: true
    publish_rate: 10.0
    path_min_distance: 0.01
    max_path_length: 3000
    frame_id: world
    path_z: 0.10
    current_z: 0.45
    velocity_z: 0.30
    vector_scale: 1.2
    line_width: 0.035
    broadcast_tf: true

asv_path_tracking_gazebo_marker_bridge:
  ros__parameters:
    use_sim_time: true
    line_width: 0.045
    path_z: 0.12
    publish_reference: true
    publish_actual: true
